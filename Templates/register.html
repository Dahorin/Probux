<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body>
    <section class="section">
        <div class="container">
            <div class="columns is-centered">
                <div class="column is-5-tablet is-4-desktop">
                    <div class="box">
                        <h2 class="title has-text-centered">Registro</h2>
                        
                        <form method="POST">
                            <div class="field">
                                <label class="label">Usuário</label>
                                <div class="control has-icons-left">
                                    <input class="input" type="text" name="username" placeholder="Usuário" required>
                                    <span class="icon is-small is-left">
                                        <i class="fas fa-user"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Senha</label>
                                <div class="control has-icons-left">
                                    <input class="input" type="password" name="password" placeholder="Senha" required>
                                    <span class="icon is-small is-left">
                                        <i class="fas fa-lock"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="field">
                                <div class="control">
                                    <button class="button is-primary is-fullwidth" type="submit">
                                        Registrar
                                    </button>
                                </div>
                            </div>
                        </form>

                        <hr>
                        
                        <p class="has-text-centered">
                            <a href="/login">Já tem conta? Login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Opcional: Font Awesome para os ícones -->
    <script defer src="https://use.fontawesome.com/releases/v5.15.4/js/all.js"></script>
</body>
</html>
